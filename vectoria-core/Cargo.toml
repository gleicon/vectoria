[package]
name = "vectoria-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Embedded hybrid search engine core — BM25 + vector + behavioral signals"
keywords = ["search", "vector", "bm25", "hybrid", "ecommerce"]
categories = ["database", "algorithms", "data-structures"]
readme = "../README.md"

[features]
# Enable LayaReranker (System One, requires laya-onnx model download ~524MB).
# huggingface-cli download nvkudda/laya-onnx-q8 --local-dir ./laya-q8
laya = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
fastembed = { workspace = true }
edgestore = { workspace = true }
edgestore-text = { workspace = true }
bm25 = { workspace = true }
symspell = { workspace = true }
foyer = { workspace = true }
flate2 = "1"

# LayaReranker optional deps (ort is already a transitive dep via fastembed; versions must match).
ort = { version = "2.0.0-rc.9", optional = true }
tokenizers = { version = "0.21.4", optional = true, default-features = false, features = ["onig"] }
ndarray = { version = "0.16", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros"] }
tempfile = "3"
